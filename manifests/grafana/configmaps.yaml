# Grafana 的 provisioning 配置（Deployment 里以三个 ConfigMap 挂载）。
#
# 为什么单独一个文件：原来只有 deployment.yaml / svc.yaml，这三个 ConfigMap
# **没有对应的 manifest** —— 首次部署时是手工 `kubectl create configmap` 建的。
# 换台机器重建会卡在 `FailedMount: configmap "grafana-*" not found`（Pod 一直
# ContainerCreating）。本文件把来源固定为下面的 provisioning/ 与 dashboards/ 文件。
#
# 挂载点（见 deployment.yaml）：
#   grafana-datasource           → /etc/grafana/provisioning/datasources
#   grafana-dashboards-provider  → /etc/grafana/provisioning/dashboards
#   grafana-dashboard-json       → /var/lib/grafana/dashboards
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: order
data:
  prometheus.yaml: |
    # Grafana 数据源（provisioning 自动加载）
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus:9090
      access: proxy
      isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: order
data:
  dashboards.yaml: |
    # Grafana 仪表盘 provider（自动加载 dashboard JSON）
    apiVersion: 1
    providers:
    - name: default
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: order
data:
  service-resources.json: |
    {
      "uid": "service-resources",
      "title": "服务资源监控（准实时）",
      "tags": ["aiops", "testbed"],
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "schemaVersion": 38,
      "version": 4,
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "服务",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": { "query": "label_values(jvm_gc_pause_seconds_sum, service)", "refId": "service" },
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "order-service|warranty-service|gateway-service"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "CPU 使用（核）",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{pod=~\"$service-.*\"}[2m]) and on(pod) (container_last_seen{pod=~\"$service-.*\"} > time() - 60)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "CPU 利用率 %（order-service，500m limit）",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } },
          "targets": [
            {
              "expr": "100 * (rate(container_cpu_usage_seconds_total{pod=~\"order-service-.*\"}[2m]) and on(pod) (container_last_seen{pod=~\"order-service-.*\"} > time() - 60)) / on(pod) (container_spec_cpu_quota{pod=~\"order-service-.*\"} / container_spec_cpu_period{pod=~\"order-service-.*\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "内存使用",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{pod=~\"$service-.*\"} and on(pod) (container_last_seen{pod=~\"$service-.*\"} > time() - 60)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "磁盘 /data 用量（order-service）",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "data_disk_total_bytes - data_disk_free_bytes",
              "legendFormat": "used",
              "refId": "A"
            },
            {
              "expr": "data_disk_total_bytes",
              "legendFormat": "capacity",
              "refId": "B"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 }
        },
        {
          "id": 6,
          "type": "gauge",
          "title": "磁盘利用率 %（order-service /data）",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } },
          "targets": [
            {
              "expr": "100 * (data_disk_total_bytes - data_disk_free_bytes) / data_disk_total_bytes",
              "legendFormat": "data disk",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "GC 暂停（JVM）",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "sum by (service) (rate(jvm_gc_pause_seconds_sum{service=~\"$service\"}[2m]))",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        }
      ]
    }
