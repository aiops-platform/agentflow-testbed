# Prometheus 配置 —— 测试床资源监控（准实时）
# 采集模型：pull（每 5s 拉取各 exporter 的 /metrics）
global:
  scrape_interval: 5s        # 准实时（测试床规模小，5s 负载可忽略）
  evaluation_interval: 10s   # 告警规则评估周期

# 告警规则：场景1 的 CPU/磁盘打满。
# ⚠️ 规则**只评估、不外发**：本文件没有 `alerting:` 段，集群里也没有 Alertmanager ⇒
#    `PodCPUHigh` 不会通知任何人。CPU 的判定改走 APM 的采集链路（判定语写在查询里），
#    见 multi-agent-workflow/docs/todos/METRIC_PIPELINE_BEST_PRACTICE_zh-CN.md。
rule_files:
- /etc/prometheus/rules/*.yml

scrape_configs:
  # ── 1. cAdvisor：每容器 CPU/内存/磁盘（kubelet 暴露）──
  - job_name: 'kubernetes-cadvisor'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
    - role: node
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - target_label: __address__
      replacement: kubernetes.default.svc:443
    - source_labels: [__meta_kubernetes_node_name]
      regex: (.+)
      target_label: __metrics_path__
      replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  # ── 1b. kubelet /metrics：节点 + PVC 磁盘用量（kubelet_volume_stats_*）──
  - job_name: 'kubernetes-kubelet'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
    - role: node
    relabel_configs:
    - target_label: __address__
      replacement: kubernetes.default.svc:443
    - source_labels: [__meta_kubernetes_node_name]
      regex: (.+)
      target_label: __metrics_path__
      replacement: /api/v1/nodes/${1}/proxy/metrics

  # ── 2/3/4. kube-state-metrics / node-exporter / app-resources：**已移除**（2026-09-29）──
  # 这三个 job **从建库起就没生效过**，留在配置里只会让人以为有这路数据（实测过）：
  #   · kube-state-metrics：集群里没有这个 pod ⇒ 一个 target 都发现不了
  #     （`count(kube_pod_info)` = 0）
  #   · node-exporter：集群里没有这个 Service ⇒ 同上（`count(node_cpu_seconds_total)` = 0）
  #   · app-resources：它按 prometheus.io/scrape 注解抓 pod 的**默认路径 /metrics**，
  #     而应用暴露的是 /actuator/prometheus ⇒ 三个业务 pod **全部 up=0**（长期失败的 job）。
  #     同一批数据由下面的 app-metrics 抓（路径正确，同样打 service 标签），删掉不丢东西。
  # 将来要用 K8s 对象/节点级指标，请**连同 exporter 一起部署**，别只留配置——
  # node-exporter 能回答「CPU 高是这一个 pod 还是整台机器」，但目前没有任何工具消费它，
  # 所以这一轮不装（避免"加了东西但消费方为零"）。

  # ── 2. Micrometer（Actuator）：JVM 内部指标（GC/堆/线程）──
  #     Boot 3.3 原生 /actuator/prometheus，无需 jmx-exporter
  - job_name: 'app-metrics'
    metrics_path: /actuator/prometheus
    kubernetes_sd_configs:
    - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      action: keep
      regex: "true"
    - source_labels: [__meta_kubernetes_pod_label_app]
      target_label: service
    - source_labels: [__meta_kubernetes_pod_ip]
      target_label: __address__
      replacement: ${1}:8080
