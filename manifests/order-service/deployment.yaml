apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: order
  labels:
    app: order-service
    # Smart Inspection 展示元数据（agentflow 从 K8s API 读，不参与调度/选择器）。
    # 改动后需 kubectl apply 才生效；label 值是声明配置，不是实测数据。
    aiops/type: sales
    aiops/owner: h.a.hu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
      - name: order-service
        image: order-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: QUOTATION_TEMP_LEAK   # 场景1 bug 开关
          value: "false"
        resources:
          limits:
            cpu: "1"                  # 场景1 忙循环会打满任何 limit，1 核照样 100% 触发告警
            memory: "1Gi"             # 需容纳 tmpfs /data 的 512Mi + 应用自身 ~254MiB；512Mi 会让场景1 写盘变 OOMKill
          requests:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - mountPath: /data
          name: data
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          failureThreshold: 30        # 最多 30×10s=5min 启动窗口
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: data
        emptyDir:
          medium: Memory        # tmpfs，有真实大小限制
          sizeLimit: 512Mi
